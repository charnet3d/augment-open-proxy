name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.2.3). Must match package.json version. Tags the commit if no matching tag exists.'
        required: true
        type: string

permissions:
  contents: write    # create GitHub Release + push tags from workflow_dispatch
  packages: write    # push to ghcr.io
  id-token: write    # OIDC for npm provenance

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # validate: parse the version, assert it matches package.json, and (for
  # workflow_dispatch) ensure a matching git tag exists so all downstream
  # jobs can rely on `github.ref_name`/the resolved tag.
  # ───────────────────────────────────────────────────────────────────────
  validate:
    name: validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}      # e.g. 1.2.3 (no leading v)
      tag: ${{ steps.resolve.outputs.tag }}              # e.g. v1.2.3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history to push tags

      - id: resolve
        name: Resolve version + tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must be vMAJOR.MINOR.PATCH (optionally with -prerelease)"
            exit 1
          fi
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally — skipping push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # ───────────────────────────────────────────────────────────────────────
  # test: gate everything downstream — never publish a broken build.
  # ───────────────────────────────────────────────────────────────────────
  test:
    name: build + test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ───────────────────────────────────────────────────────────────────────
  # build-binaries: one runner per target — SEA does not cross-compile.
  # ───────────────────────────────────────────────────────────────────────
  build-binaries:
    name: binary (${{ matrix.target }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: macos-latest,     target: darwin-arm64 }
          - { os: windows-latest,   target: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build SEA binary
        run: node scripts/build-sea.mjs ${{ matrix.target }}
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            build/sea/dist/augment-open-proxy-${{ matrix.target }}.tar.gz
            build/sea/dist/augment-open-proxy-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # publish-npm: publish the package with OIDC provenance.
  # Requires repo secret NPM_TOKEN (automation token with publish perms).
  # ───────────────────────────────────────────────────────────────────────
  publish-npm:
    name: publish to npm
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing requires npm >= 11.5.1. Node 22 LTS still
      # ships npm 10.x, so we upgrade npm explicitly here. Doing this AFTER
      # `npm ci` would invalidate the lockfile resolution; doing it BEFORE
      # means the install also runs on the newer npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Build
        run: npm run build
      # No NODE_AUTH_TOKEN — npm uses the GitHub OIDC id-token (granted at the
      # workflow level above) to authenticate via the trusted publisher
      # configured on npmjs.com.
      - name: Publish
        run: npm publish --provenance --access public

  # ───────────────────────────────────────────────────────────────────────
  # publish-docker: build multi-arch (amd64 + arm64) image and push to
  # GitHub Container Registry. Uses the built-in GITHUB_TOKEN — no extra
  # secret needed. The first push creates a package linked to this repo
  # via the org.opencontainers.image.source label.
  # ───────────────────────────────────────────────────────────────────────
  publish-docker:
    name: publish to ghcr.io
    needs: [validate, test]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.validate.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────
  # create-release: gathers binaries from build-binaries and attaches them
  # to a GitHub Release named after the tag. Only runs once all publish
  # jobs succeed — the release page is the single source of truth that all
  # three channels (npm, GHCR, binaries) shipped together.
  # ───────────────────────────────────────────────────────────────────────
  create-release:
    name: create GitHub Release
    needs: [validate, build-binaries, publish-npm, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Show downloaded artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/augment-open-proxy-*.tar.gz
            artifacts/augment-open-proxy-*.zip
          body: |
            ## Install

            **npm**
            ```
            npx augment-open-proxy@${{ needs.validate.outputs.version }}
            ```

            **Docker**
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}
            ```

            **Binary** — download the archive for your platform below.
